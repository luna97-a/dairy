<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 다이어리</title>
<meta name="apple-mobile-web-app-title" content="나의 다이어리">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#4F7A5A">
<script>
  /* ▼▼▼ 여기에 앱스크립트 웹 앱 주소(…/exec)를 붙여넣으세요 ▼▼▼ */
  const DIARY_URL = 'https://script.google.com/a/macros/senedu.kr/s/AKfycbyBrTlnOG06B5Fw8xtheETGTlkcUa9vHI7fBGdiCqTXzqjI6yQi9nOqTbXej-8ghUc1rg/exec';
  /* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */

  // 주소 끝에 #설치 또는 #install 을 붙여 열면 넘어가지 않고 설치 안내를 보여 줍니다.
  const installMode = /^#(install|%EC%84%A4%EC%B9%98|설치)$/.test(location.hash);
  if (installMode) {
    // 홈 화면에 저장되는 주소에는 #install 이 남지 않도록 지움
    history.replaceState(null, '', location.pathname + location.search);
  } else {
    location.replace(DIARY_URL);
  }
</script>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#F3F5EF;color:#1F2A44;font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:24px;box-sizing:border-box}
  @media (prefers-color-scheme:dark){body{background:#161B26;color:#E6E9F0}}
  .box{max-width:360px;text-align:center}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  h1{font-size:1.3rem;margin:18px 0 8px}
  p{font-size:.95rem;line-height:1.7;margin:0 0 18px;opacity:.85}
  a{display:inline-block;background:#4F7A5A;color:#fff;text-decoration:none;padding:12px 22px;border-radius:12px;font-size:1rem}
</style>
</head>
<body>
  <div class="box">
    <img src="icon-512.png" alt="">
    <h1>나의 다이어리</h1>
    <p id="msg">다이어리로 이동하는 중입니다…</p>
    <a id="go" href="#">다이어리 열기</a>
  </div>
  <script>
    document.getElementById('go').href = DIARY_URL;
    if (installMode) {
      document.getElementById('msg').innerHTML =
        '지금 화면에서 사파리 <b>공유 버튼</b>을 누르고<br><b>\'홈 화면에 추가\'</b>를 고르세요.<br>일기장 아이콘이 자동으로 들어갑니다.';
    }
  </script>
</body>
</html>
